<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f32">
  <meta name="description" content="Dhanvidhanvantari Ayurcare — our website is coming soon.">
  <title>Coming Soon | Dhanvidhanvantari Ayurcare</title>
  <style>
    :root {
      --forest: #173f32;
      --forest-deep: #102f26;
      --sage: #dce8d8;
      --cream: #fbf8ef;
      --gold: #c69a50;
      --ink: #24352e;
      --muted: #66756d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 12% 16%, rgba(198,154,80,.13), transparent 26rem),
        radial-gradient(circle at 88% 82%, rgba(105,145,108,.16), transparent 28rem),
        var(--cream);
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }
    .shell {
      width: min(900px, 100%);
      min-height: 590px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(34px, 7vw, 76px);
      border: 1px solid rgba(23,63,50,.16);
      border-radius: 28px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 24px 70px rgba(27,54,42,.10);
    }
    .shell::before, .shell::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border: 1px solid rgba(23,63,50,.12);
      border-radius: 50%;
      pointer-events: none;
    }
    .shell::before { top: -145px; left: -105px; }
    .shell::after { bottom: -150px; right: -110px; }
    .content { max-width: 650px; position: relative; z-index: 1; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 22px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: var(--cream);
      background: var(--forest);
      box-shadow: 0 0 0 8px rgba(23,63,50,.08);
    }
    .mark svg { width: 42px; height: 42px; }
    .eyebrow {
      color: #8b6a32;
      text-transform: uppercase;
      letter-spacing: .22em;
      font: 600 11px/1.5 Arial, sans-serif;
      margin: 0 0 14px;
    }
    h1 {
      color: var(--forest);
      font-size: clamp(36px, 6vw, 62px);
      line-height: 1.08;
      font-weight: 500;
      margin: 0;
    }
    .rule {
      width: 74px; height: 2px; margin: 25px auto;
      background: var(--gold);
    }
    .message {
      max-width: 540px;
      margin: 0 auto;
      color: var(--muted);
      font: 16px/1.8 Arial, sans-serif;
    }
    .coming {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 22px;
      border: 1px solid rgba(23,63,50,.28);
      border-radius: 999px;
      color: var(--forest);
      font: 600 11px/1.2 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .footer {
      margin-top: 42px;
      color: #89948d;
      font: 11px/1.5 Arial, sans-serif;
      letter-spacing: .08em;
    }
    @media (max-width: 520px) {
      .shell { min-height: 540px; border-radius: 20px; }
      .message { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="content" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 39V20" stroke="#FBF8EF" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M24 27C13 27 9 20 10 11C19 10 26 15 24 27Z" stroke="#DCE8D8" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M24 32C35 32 39 25 38 16C29 15 22 20 24 32Z" stroke="#DCE8D8" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M14 14L23 25M34 19L25 29" stroke="#DCE8D8" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="eyebrow">A new beginning in mindful wellness</p>
      <h1 id="page-title">Dhanvidhanvantari<br>Ayurcare</h1>
      <div class="rule"></div>
      <p class="message">
        We’re preparing something special for you. Our website is getting ready
        to share more about our care and services. Please visit us again soon.
      </p>
      <div class="coming">Website launching soon</div>
      <p class="footer">THANK YOU FOR YOUR PATIENCE</p>
    </section>
  </main>
</body>
</html>
